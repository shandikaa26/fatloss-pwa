<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="7-Day Fit" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <!-- Theme & App Description -->
    <meta name="theme-color" content="#0b0f17" />
    <meta name="description" content="Aplikasi PWA iOS interaktif untuk 7-Day Bodyweight Fat Loss Plan dengan pelacakan kalori, menu lokal Indonesia, latihan calisthenics terpandu, dan visualisasi Apple Health rings." />
    <link rel="manifest" href="/manifest.json" />

    <title>7-Day Bodyweight Fat Loss</title>
  </head>
  <body class="bg-[#0b0f17] text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration skipped or error:', err);
          });
        });
      }
    </script>
  </body>
</html>
